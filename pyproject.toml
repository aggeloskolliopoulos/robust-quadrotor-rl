[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-quadrotor-rl"
version = "0.1.0"
description = "Robust quadrotor trajectory tracking with PID and deep reinforcement learning."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]